skill: ansible
version: '1.0'
tools:
- name: ansible_run
  description: Run Ansible playbook
  entrypoint: scripts/run.py
  entrypoint_type: python
  timeout_seconds: 60
  requires_sandbox: true
  returns:
    type: object
    properties:
      success:
        type: boolean
      output:
        type: object
      error:
        type: string
  parameters:
    playbook:
      type: string
    inventory:
      type: string
    tags:
      type: string
