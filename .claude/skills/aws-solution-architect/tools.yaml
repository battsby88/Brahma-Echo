skill: aws-solution-architect
version: '1.0'
tools:
- name: aws-solution-architect_run
  description: Run AWS CLI operation
  entrypoint: scripts/run.py
  entrypoint_type: python
  timeout_seconds: 60
  requires_sandbox: true
  returns:
    type: object
    properties:
      success:
        type: boolean
      output:
        type: object
      error:
        type: string
  parameters:
    service:
      type: string
    operation:
      type: string
    region:
      type: string
      default: us-east-1
