skill: cloudflare
version: '1.0'
tools:
- name: cloudflare_run
  description: Run Cloudflare operation
  entrypoint: scripts/run.py
  entrypoint_type: python
  timeout_seconds: 60
  requires_sandbox: true
  returns:
    type: object
    properties:
      success:
        type: boolean
      output:
        type: object
      error:
        type: string
  parameters:
    zone:
      type: string
    operation:
      type: string
