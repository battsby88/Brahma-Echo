skill: senior-security
version: '1.0'
tools:
- name: sec_scan
  description: Run security scan
  entrypoint: scripts/run.py
  entrypoint_type: python
  timeout_seconds: 60
  requires_sandbox: true
  returns:
    type: object
    properties:
      success:
        type: boolean
      output:
        type: object
      error:
        type: string
  parameters:
    target:
      type: string
    type:
      type: string
      enum:
      - sast
      - dast
      - sca
      - container
