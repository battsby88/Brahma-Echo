skill: houdini
version: '1.0'
tools:
- name: houdini_run
  description: Run Houdini operation
  entrypoint: scripts/run.py
  entrypoint_type: python
  timeout_seconds: 60
  requires_sandbox: true
  returns:
    type: object
    properties:
      success:
        type: boolean
      output:
        type: object
      error:
        type: string
  parameters:
    operation:
      type: string
      enum:
      - render
      - vex
    file:
      type: string
