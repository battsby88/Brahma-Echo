skill: azure-cloud-architect
version: '1.0'
tools:
- name: azure-cloud-architect_run
  description: Run Azure CLI operation
  entrypoint: scripts/run.py
  entrypoint_type: python
  timeout_seconds: 60
  requires_sandbox: true
  returns:
    type: object
    properties:
      success:
        type: boolean
      output:
        type: object
      error:
        type: string
  parameters:
    service:
      type: string
    operation:
      type: string
    subscription:
      type: string
