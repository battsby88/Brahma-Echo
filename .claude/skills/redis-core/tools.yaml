skill: redis-core
version: '1.0'
tools:
- name: redis_run
  description: Run Redis command
  entrypoint: scripts/run.py
  entrypoint_type: python
  timeout_seconds: 60
  requires_sandbox: true
  returns:
    type: object
    properties:
      success:
        type: boolean
      output:
        type: object
      error:
        type: string
  parameters:
    command:
      type: string
    key:
      type: string
