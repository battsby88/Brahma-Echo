skill: grafana
version: '1.0'
tools:
- name: grafana_run
  description: Manage Grafana dashboard
  entrypoint: scripts/run.py
  entrypoint_type: python
  timeout_seconds: 60
  requires_sandbox: true
  returns:
    type: object
    properties:
      success:
        type: boolean
      output:
        type: object
      error:
        type: string
  parameters:
    operation:
      type: string
      enum:
      - create
      - update
      - get
    uid:
      type: string
