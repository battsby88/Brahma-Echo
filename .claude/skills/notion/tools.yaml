skill: notion
version: '1.0'
tools:
- name: notion_run
  description: Manage Notion page
  entrypoint: scripts/run.py
  entrypoint_type: python
  timeout_seconds: 60
  requires_sandbox: true
  returns:
    type: object
    properties:
      success:
        type: boolean
      output:
        type: object
      error:
        type: string
  parameters:
    operation:
      type: string
      enum:
      - create
      - update
      - get
    page_id:
      type: string
    content:
      type: object
