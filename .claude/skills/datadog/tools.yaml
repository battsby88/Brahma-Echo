skill: datadog
version: '1.0'
tools:
- name: datadog_run
  description: Send Datadog metric
  entrypoint: scripts/run.py
  entrypoint_type: python
  timeout_seconds: 60
  requires_sandbox: true
  returns:
    type: object
    properties:
      success:
        type: boolean
      output:
        type: object
      error:
        type: string
  parameters:
    metric:
      type: string
    value:
      type: number
    tags:
      type: array
