skill: langgraph
version: '1.0'
tools:
- name: lg_run
  description: Run LangGraph graph
  entrypoint: scripts/run.py
  entrypoint_type: python
  timeout_seconds: 60
  requires_sandbox: true
  returns:
    type: object
    properties:
      success:
        type: boolean
      output:
        type: object
      error:
        type: string
  parameters:
    graph:
      type: string
    state:
      type: object
