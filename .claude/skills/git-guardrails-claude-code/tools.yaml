skill: git-guardrails-claude-code
version: '1.0'
tools:
- name: git_run
  description: Run git operation
  entrypoint: scripts/run.py
  entrypoint_type: python
  timeout_seconds: 60
  requires_sandbox: true
  returns:
    type: object
    properties:
      success:
        type: boolean
      output:
        type: object
      error:
        type: string
  parameters:
    operation:
      type: string
      enum:
      - commit
      - push
      - pull
      - status
      - diff
    path:
      type: string
