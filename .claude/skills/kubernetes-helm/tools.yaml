skill: kubernetes-helm
version: '1.0'
tools:
- name: k8s_run
  description: Run Kubernetes operation
  entrypoint: scripts/run.py
  entrypoint_type: python
  timeout_seconds: 60
  requires_sandbox: true
  returns:
    type: object
    properties:
      success:
        type: boolean
      output:
        type: object
      error:
        type: string
  parameters:
    operation:
      type: string
      enum:
      - apply
      - delete
      - logs
      - exec
    manifest:
      type: string
