skill: mongodb
version: '1.0'
tools:
- name: mongodb_run
  description: Run MongoDB query
  entrypoint: scripts/run.py
  entrypoint_type: python
  timeout_seconds: 60
  requires_sandbox: true
  returns:
    type: object
    properties:
      success:
        type: boolean
      output:
        type: object
      error:
        type: string
  parameters:
    collection:
      type: string
    operation:
      type: string
    filter:
      type: object
