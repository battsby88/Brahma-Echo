skill: vercel-react-best-practices
version: '1.0'
tools:
- name: vercel-react-best-practices_run
  description: Deploy to Vercel
  entrypoint: scripts/run.py
  entrypoint_type: python
  timeout_seconds: 60
  requires_sandbox: true
  returns:
    type: object
    properties:
      success:
        type: boolean
      output:
        type: object
      error:
        type: string
  parameters:
    project:
      type: string
    env:
      type: string
      enum:
      - preview
      - production
