skill: autocad-mcp-premium
version: '1.0'
tools:
- name: autocad-mcp-premium_run
  description: Run AutoCAD operation
  entrypoint: scripts/run.py
  entrypoint_type: python
  timeout_seconds: 60
  requires_sandbox: true
  returns:
    type: object
    properties:
      success:
        type: boolean
      output:
        type: object
      error:
        type: string
  parameters:
    operation:
      type: string
      enum:
      - plot
      - export
      - lisp
    file:
      type: string
