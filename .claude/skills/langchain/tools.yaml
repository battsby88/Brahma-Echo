skill: langchain
version: '1.0'
tools:
- name: lc_run
  description: Run LangChain chain
  entrypoint: scripts/run.py
  entrypoint_type: python
  timeout_seconds: 60
  requires_sandbox: true
  returns:
    type: object
    properties:
      success:
        type: boolean
      output:
        type: object
      error:
        type: string
  parameters:
    chain:
      type: string
    inputs:
      type: object
