skill: linear-sdk-scripting
version: '1.0'
tools:
- name: linear-sdk-scripting_run
  description: Manage Linear issue
  entrypoint: scripts/run.py
  entrypoint_type: python
  timeout_seconds: 60
  requires_sandbox: true
  returns:
    type: object
    properties:
      success:
        type: boolean
      output:
        type: object
      error:
        type: string
  parameters:
    operation:
      type: string
      enum:
      - create
      - update
      - get
    team:
      type: string
    title:
      type: string
