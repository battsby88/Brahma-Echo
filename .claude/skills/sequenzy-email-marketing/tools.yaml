skill: sequenzy-email-marketing
version: '1.0'
tools:
- name: sequenzy-email-marketing_run
  description: Send email
  entrypoint: scripts/run.py
  entrypoint_type: python
  timeout_seconds: 60
  requires_sandbox: true
  returns:
    type: object
    properties:
      success:
        type: boolean
      output:
        type: object
      error:
        type: string
  parameters:
    to:
      type: string
    subject:
      type: string
    body:
      type: string
    html:
      type: boolean
