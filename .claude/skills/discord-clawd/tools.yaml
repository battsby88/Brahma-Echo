skill: discord-clawd
version: '1.0'
tools:
- name: discord_send
  description: Send Discord message
  entrypoint: scripts/run.py
  entrypoint_type: python
  timeout_seconds: 60
  requires_sandbox: true
  returns:
    type: object
    properties:
      success:
        type: boolean
      output:
        type: object
      error:
        type: string
  parameters:
    channel:
      type: string
    content:
      type: string
    embed:
      type: object
