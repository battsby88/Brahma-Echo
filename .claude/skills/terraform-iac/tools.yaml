skill: terraform-iac
version: '1.0'
tools:
- name: terraform-iac_run
  description: Run Terraform operation
  entrypoint: scripts/run.py
  entrypoint_type: python
  timeout_seconds: 60
  requires_sandbox: true
  returns:
    type: object
    properties:
      success:
        type: boolean
      output:
        type: object
      error:
        type: string
  parameters:
    operation:
      type: string
      enum:
      - plan
      - apply
      - destroy
      - init
    dir:
      type: string
