skill: cinema4d-mcp
version: '1.0'
tools:
- name: c4d_run
  description: Run Cinema 4D operation
  entrypoint: scripts/run.py
  entrypoint_type: python
  timeout_seconds: 60
  requires_sandbox: true
  returns:
    type: object
    properties:
      success:
        type: boolean
      output:
        type: object
      error:
        type: string
  parameters:
    operation:
      type: string
      enum:
      - render
      - export
      - mograph
    file:
      type: string
