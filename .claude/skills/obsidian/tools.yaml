skill: obsidian
version: '1.0'
tools:
- name: obsidian_run
  description: Manage Obsidian note
  entrypoint: scripts/run.py
  entrypoint_type: python
  timeout_seconds: 60
  requires_sandbox: true
  returns:
    type: object
    properties:
      success:
        type: boolean
      output:
        type: object
      error:
        type: string
  parameters:
    operation:
      type: string
      enum:
      - create
      - update
      - search
    vault:
      type: string
    note:
      type: string
