skill: slack-e2e
version: '1.0'
tools:
- name: slack-e2e_run
  description: Send Slack message
  entrypoint: scripts/run.py
  entrypoint_type: python
  timeout_seconds: 60
  requires_sandbox: true
  returns:
    type: object
    properties:
      success:
        type: boolean
      output:
        type: object
      error:
        type: string
  parameters:
    channel:
      type: string
    text:
      type: string
    blocks:
      type: object
