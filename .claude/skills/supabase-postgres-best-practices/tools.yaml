skill: supabase-postgres-best-practices
version: '1.0'
tools:
- name: supabase-postgres-best-practices_run
  description: Run PostgreSQL query
  entrypoint: scripts/run.py
  entrypoint_type: python
  timeout_seconds: 60
  requires_sandbox: true
  returns:
    type: object
    properties:
      success:
        type: boolean
      output:
        type: object
      error:
        type: string
  parameters:
    query:
      type: string
    database:
      type: string
