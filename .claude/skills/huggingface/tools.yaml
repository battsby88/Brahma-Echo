skill: huggingface
version: '1.0'
tools:
- name: huggingface_run
  description: Run HuggingFace model
  entrypoint: scripts/run.py
  entrypoint_type: python
  timeout_seconds: 60
  requires_sandbox: true
  returns:
    type: object
    properties:
      success:
        type: boolean
      output:
        type: object
      error:
        type: string
  parameters:
    model:
      type: string
    inputs:
      type: object
    task:
      type: string
